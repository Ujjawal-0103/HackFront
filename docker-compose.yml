services:
  # Primary PostgreSQL Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: traceback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: traceback_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceback_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Background Ingestion Job Queue (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: traceback-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
