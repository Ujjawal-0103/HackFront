services:
  # Primary PostgreSQL Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: traceback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: traceback_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceback_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Background Ingestion Job Queue (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: traceback-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Neo4j Graph Database (Sprint 4 Architecture Evaluation)
  neo4j:
    image: neo4j:5-community
    container_name: traceback-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/tracebackpassword
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
